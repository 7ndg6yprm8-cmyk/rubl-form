<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="referrer" content="no-referrer"><title>Рубль · новая операция</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f3f5f3;--card:#fff;--ink:#192c25;--muted:#747c78;--accent:#1a6248;--line:#e7eae7;--soft:#eaf1e9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:24px 20px calc(28px + env(safe-area-inset-bottom));padding-top:calc(24px + env(safe-area-inset-top));font-size:16px;line-height:1.45}main{max-width:520px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:650;letter-spacing:-.5px}.logo{width:36px;height:36px;border-radius:12px;background:#194734;color:#def1b8;display:grid;place-items:center;font-size:24px}header small{font-size:12px;letter-spacing:1px;color:var(--muted)}h1{font-size:30px;line-height:1.1;letter-spacing:-1px;font-weight:650;margin:0 0 22px}.tabs{display:flex;padding:4px;background:var(--line);border-radius:14px;gap:4px;margin-bottom:18px}.tabs button{flex:1;padding:11px 4px;border:0;background:none;color:var(--muted);border-radius:11px;font-size:14px;font-weight:600}.tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 2px 4px #00000008}.amount-card{background:linear-gradient(125deg,#224e3f,#142e25);border-radius:24px;padding:24px;color:white;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:1.4px;opacity:.75}.amount-line{display:flex;align-items:center;gap:12px;margin-top:12px}.amount-line input{width:100%;min-width:0;color:#fff;background:none;border:0;outline:none;font-size:48px;letter-spacing:-2px;padding:0;font-weight:600;font-variant-numeric:tabular-nums}.amount-line input::placeholder{color:#ffffff70}.amount-line span{font-size:19px;opacity:.8}.fields{background:var(--card);border-radius:22px;padding:5px 18px;margin-bottom:18px}.field{padding:14px 0;border-bottom:1px solid var(--line)}.field:last-child{border:0}label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:7px}input,select,textarea{font:inherit;color:var(--ink);background:transparent;width:100%;border:0;border-radius:0;padding:4px 0;min-height:30px}textarea{resize:vertical}select{min-height:36px}input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:5px;border-radius:4px}button{font:inherit;cursor:pointer;touch-action:manipulation;transition:transform 120ms cubic-bezier(.23,1,.32,1)}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:default}.submit{background:var(--accent);color:white;border:0;width:100%;padding:17px;border-radius:16px;font-weight:600}.helper{font-size:13px;color:var(--muted);text-align:center;padding:0 12px}.haptic{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);padding:6px 4px 18px}.haptic label{margin:0;font-size:14px}.haptic input{width:22px;accent-color:var(--accent)}#error{color:#c03d36;font-size:14px;margin:12px 0}#notice{font-size:14px;background:var(--soft);border-radius:14px;padding:14px;margin-bottom:16px}[hidden]{display:none!important}.dark{--bg:#131917;--card:#1d2621;--ink:#edf1ee;--muted:#a0aba4;--accent:#76ba95;--line:#303a33;--soft:#253b2e;color-scheme:dark}.dark .submit{color:#102319}@media(prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
</style></head><body><main>
<header><div class="brand"><span class="logo" aria-hidden="true">₽</span>рубль</div><small>ЛИЧНЫЕ ФИНАНСЫ</small></header>
<h1>Новая операция</h1><div id="notice" hidden></div>
<form id="form" novalidate>
<div class="tabs" aria-label="Тип операции"><button type="button" data-kind="expense" aria-pressed="true">Расход</button><button type="button" data-kind="income" aria-pressed="false">Доход</button><button type="button" data-kind="transfer" aria-pressed="false">Перевод</button></div>
<section class="amount-card"><label for="amount" class="eyebrow">СУММА</label><div class="amount-line"><input id="amount" inputmode="decimal" placeholder="0" autocomplete="off" maxlength="16" required><span id="currency">RUB</span></div></section>
<section class="fields">
<div class="field"><label for="account">Счёт</label><select id="account" required></select></div>
<div class="field" id="destination-field" hidden><label for="destination">На счёт</label><select id="destination"></select></div>
<div class="field" id="received-field" hidden><label for="received">Сумма зачисления</label><input id="received" inputmode="decimal" placeholder="0,00" maxlength="16"></div>
<div class="field" id="category-field"><label for="category">Категория</label><select id="category"><option>Продукты</option><option>Кафе</option><option>Транспорт</option><option>Дом</option><option>Покупки</option><option>Здоровье</option><option>Подписки</option><option>Отдых</option><option>Зарплата</option><option>Другое</option><option value="custom">Своя категория…</option></select><input id="custom-category" placeholder="Название категории" aria-label="Своя категория" maxlength="60" hidden></div>
<div class="field"><label for="day">Дата</label><input id="day" type="date" required></div>
</section>
<section class="fields"><div class="field"><label for="note">Заметка</label><textarea id="note" rows="1" maxlength="500" placeholder="На что потратили?"></textarea></div><div class="field"><label for="tags">Метки</label><input id="tags" maxlength="200" placeholder="Личное, отпуск" autocomplete="off"></div></section>
<div class="haptic"><label for="haptic">Тактильный отклик</label><input id="haptic" type="checkbox" checked></div>
<p id="error" role="alert"></p><button class="submit" id="submit" type="submit">Проверить и продолжить</button>
<p class="helper">Бот покажет детали и попросит подтвердить сохранение.</p>
</form></main><script src="app.js"></script></body></html>
